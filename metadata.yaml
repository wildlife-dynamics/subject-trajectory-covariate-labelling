name: Subject Trajectory Covariate Labelling

# at least one author is required
author:
  - name: "Rodney Omukuti"
    organization: "Wildlife Dynamics"
    email: "rodney@wildlifedynamics.com"

description: >-
  Builds a subject trajectory from EarthRanger and labels each segment with a
  user-defined list of Google Earth Engine covariates (each either a single image,
  e.g. elevation, or a time-matched image collection, e.g. NDVI). Shows a covariate
  time-series plot with an observation rug and optionally exports the labeled table
  as CSV, Parquet or both.

