all-grouper:
  name: All Grouper
  description: Trajectory export with "all" (i.e. no) grouping.
  params:
    workflow_details:
      name: "Subject Trajectory Covariate Labelling"
      description: "Full trajectory table (step length, speed, NSD) for download, plus NSD chart and summary tiles. No home-range/ETD."
    er_client_name:
      data_source:
        name: "mep_dev"
    groupers:
      groupers: []
    time_range:
      since: "2015-01-01T00:00:00"
      until: "2015-12-31T23:59:59"
      timezone:
        label: "Africa/Nairobi (UTC+03:00)"
        tzCode: "Africa/Nairobi"
        name: "(UTC+03:00) Nairobi"
        utc: "+03:00"
    subject_obs:
      subject_group_name: "Ecoscope"
    subject_traj:
      trajectory_segment_filter:
        min_length_meters: 0.001
        max_length_meters: 10000.0
        max_time_secs: 21600.0
        min_time_secs: 1.0
        max_speed_kmhr: 10.0
        min_speed_kmhr: 0.01

value-grouper:
  name: Value Grouper
  description: Trajectory export grouped by subject name.
  params:
    workflow_details:
      name: "Subject Trajectory Covariate Labelling"
