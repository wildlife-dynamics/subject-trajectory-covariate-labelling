id: subject_trajectory_covariate_labeling
requirements:
- name: ecoscope-platform
  version: 2.16.1
  channel: https://repo.prefix.dev/ecoscope-workflows/
- name: pydeck
  version: 0.9.2
  channel: conda-forge
- name: covariate-labeling-tasks
  version: 0.3.0
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/
rjsf-overrides:
  properties:
    Subject Group.properties.subject_obs.properties.subject_group_name.ecoscope:transform:
    - transformer: EarthRangerEnumResolver
      transformer_kws:
        type: subject_group_name
        depends_on: properties.er_client_name.properties.data_source.properties.name
    groupers.properties.groupers.ecoscope:transform:
    - transformer: EarthRangerEnumResolver
      transformer_kws:
        type: spatial_feature_group
        depends_on: properties.er_client_name.properties.data_source.properties.name
  $defs:
    ValueGrouper.properties.index_name.oneOf:
    - const: subject_name
      title: Subject Name
    - const: subject_subtype
      title: Subject Subtype
    - const: subject_sex
      title: Subject Sex
  uiSchema:
    groupers.groupers.items.anyOf:
    - ui:options:
        label: false
    - ui:options:
        label: false
    - ui:options:
        label: false
task-instance-defaults:
  skipif:
    conditions:
    - any_is_empty_df
    - any_dependency_skipped
workflow:
- name: Workflow Details
  id: workflow_details
  task: set_workflow_details
- name: Data Source
  id: er_client_name
  task: set_er_connection
- name: Earth Engine Connection
  id: gee_client_name
  task: set_gee_connection
- name: Time Range
  id: time_range
  task: set_time_range
  partial:
    time_format: '%d %b %Y %H:%M:%S'
- name: Extract Timezone Selection
  id: get_timezone
  task: get_timezone_from_time_range
  partial:
    time_range: ${{ workflow.time_range.return }}
- title: Subject Group
  type: task-group
  description: Choose a subject group to analyze
  tasks:
  - name:
    id: subject_obs
    task: get_subjectgroup_observations
    partial:
      client: ${{ workflow.er_client_name.return }}
      time_range: ${{ workflow.time_range.return }}
      raise_on_empty: false
      include_details: false
      include_subjectsource_details: false
      filter: clean
- name: Convert to timezone
  id: convert_to_user_timezone
  task: convert_values_to_timezone
  partial:
    df: ${{ workflow.subject_obs.return }}
    timezone: ${{ workflow.get_timezone.return }}
    columns:
    - fixtime
- name: Group Data
  id: groupers
  task: set_groupers
- task: extract_spatial_grouper_feature_group_names
  id: spatial_group_ids
  partial:
    groupers: ${{ workflow.groupers.return }}
- task: get_spatial_features_group
  id: fetch_all_spatial_feature_groups
  partial:
    client: ${{ workflow.er_client_name.return }}
  map:
    argnames: spatial_features_group_name
    argvalues: ${{ workflow.spatial_group_ids.return }}
- task: resolve_spatial_feature_groups_for_spatial_groupers
  id: resolved_groupers
  skipif:
    conditions:
    - never
  partial:
    groupers: ${{ workflow.groupers.return }}
    spatial_feature_groups: ${{ workflow.fetch_all_spatial_feature_groups.return }}
- name: Transform Observations to Relocations
  id: subject_reloc
  task: process_relocations
  partial:
    observations: ${{ workflow.convert_to_user_timezone.return }}
    relocs_columns:
    - groupby_col
    - fixtime
    - junk_status
    - geometry
    - extra__subject__name
    - extra__subject__subject_subtype
    - extra__subject__sex
    filter_point_coords:
    - x: 180.000000
      y: 90.000000
    - x: 0.000000
      y: 0.000000
    - x: 1.000000
      y: 1.000000
- name: Apply Day/Night Labels to Relocations
  id: day_night_labels
  task: classify_is_night
  partial:
    relocations: ${{ workflow.subject_reloc.return }}
- name: Trajectory Segment Filter
  id: subject_traj
  task: relocations_to_trajectory
  partial:
    relocations: ${{ workflow.day_night_labels.return }}
- name: Add temporal index to Subject Trajectories
  id: traj_add_temporal_index
  task: add_temporal_index
  partial:
    df: ${{ workflow.subject_traj.return }}
    time_col: segment_start
    groupers: ${{ workflow.resolved_groupers.return }}
    cast_to_datetime: true
    format: mixed
- name: Add spatial index to Subject Trajectories
  id: traj_add_spatial_index
  task: add_spatial_index
  partial:
    gdf: ${{ workflow.traj_add_temporal_index.return }}
    groupers: ${{ workflow.resolved_groupers.return }}
- name: Rename value grouper columns
  id: rename_grouper_columns
  task: map_columns
  partial:
    df: ${{ workflow.traj_add_spatial_index.return }}
    drop_columns: []
    retain_columns: []
    rename_columns:
      extra__name: subject_name
      extra__subject_subtype: subject_subtype
      extra__sex: subject_sex
    raise_if_not_found: true
- name: Map Subject Sex Values
  id: map_subject_sex
  task: map_values
  partial:
    df: ${{ workflow.rename_grouper_columns.return }}
    column_name: subject_sex
    value_map:
      male: male
      female: female
    missing_values: replace
    replacement: unknown
- name: Label trajectory segments with covariates (GEE)
  id: label_covariates
  task: label_with_covariates
  partial:
    client: ${{ workflow.gee_client_name.return }}
    df: ${{ workflow.map_subject_sex.return }}
    df_chunk_size: 5000

- name: Drop patrol columns
  id: clean_traj
  task: map_columns
  partial:
    df: ${{ workflow.label_covariates.return }}
    drop_columns:
    - extra__patrol_serial_number
    - extra__patrol_status
    - extra__patrol_subject
    - extra__patrol_type__value
    retain_columns: []
    rename_columns: {}
    raise_if_not_found: false
- name: Export labeled table (CSV / Parquet / both)
  id: export_table
  task: export_labeled_table
  partial:
    df: ${{ workflow.clean_traj.return }}
    filename: trajectory_covariates
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}

- name: Split segments by group
  id: split_covariate_groups
  task: split_groups
  partial:
    df: ${{ workflow.clean_traj.return }}
    groupers: ${{ workflow.resolved_groupers.return }}
- name: Covariate time-series plot (per group)
  id: covariate_plot
  task: plot_covariate_timeseries
  partial:
    time_column: segment_start
    title: Covariate time series
    covariate_columns: null   # pinned/hidden: auto-detect the labeled covariate columns
  mapvalues:
    argnames: df
    argvalues: ${{ workflow.split_covariate_groups.return }}
- name: Persist covariate plot (per group)
  id: covariate_plot_url
  task: persist_text
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
  mapvalues:
    argnames: text
    argvalues: ${{ workflow.covariate_plot.return }}
- name: Covariate time-series widget (per group)
  id: covariate_plot_widget_views
  task: create_plot_widget_single_view
  skipif:
    conditions:
    - never
  partial:
    title: Covariate time series
  map:
    argnames:
    - view
    - data
    argvalues: ${{ workflow.covariate_plot_url.return }}
- name: Merge covariate plot views
  id: widget_covariate_plot
  task: merge_widget_views
  partial:
    widgets: ${{ workflow.covariate_plot_widget_views.return }}
- name: Results view
  id: covariate_dashboard
  task: gather_dashboard
  partial:
    details: ${{ workflow.workflow_details.return }}
    widgets:
    - ${{ workflow.widget_covariate_plot.return }}
    groupers: ${{ workflow.resolved_groupers.return }}
    time_range: ${{ workflow.time_range.return }}
